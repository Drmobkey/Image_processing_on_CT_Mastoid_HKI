services:
  # ==========================================
  # Service Backend (Flask + Gunicorn)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mastoid_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:5001}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    volumes:
      - backend_uploads:/app/uploads
      - backend_results:/app/results
    networks:
      - mastoid_network

  # ==========================================
  # Service Frontend (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL dikompilasi saat build image
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5001}
    container_name: mastoid_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - mastoid_network

volumes:
  backend_uploads:
    driver: local
  backend_results:
    driver: local

networks:
  mastoid_network:
    driver: bridge

